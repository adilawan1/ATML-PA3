# CPU smoke-test config (tiny model, 4 updates). Not used for reported results.
model: Qwen/Qwen3-0.6B
seed: 6304
data:
  source: meta-math/MetaMathQA
  gsm8k: openai/gsm8k
  n_examples: 40000
  max_len: 2048
train:
  micro_bs: 2
  grad_accum: 2
  updates: 4
  warmup: 1
  schedule: cosine
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  clip: 1.0
  grad_checkpointing: true
  init_scale: 65536.0
  ckpt_updates:
  - 1
  - 2
  - 3
  - 4
  eval_updates:
  - 2
  - 4
  keep_recovery: 1
lora:
  dropout: 0.05
  targets:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
variants:
  full_ft:
    method: full
    lr: 2.0e-05
    l2sp: 0.0
  full_ft_l2sp:
    method: full
    lr: 2.0e-05
    l2sp: 0.001
  lora4:
    method: lora
    lr: 0.0002
    r: 4
    alpha: 8
  lora16:
    method: lora
    lr: 0.0002
    r: 16
    alpha: 32
  oplora16:
    method: oplora
    lr: 0.0002
    r: 16
    alpha: 32
    k: 16
eval:
  conditions:
  - name: baseline
    variant: null
    update: 0
  - name: full_ft_mid
    variant: full_ft
    update: 2
  - name: full_ft
    variant: full_ft
    update: 4
  - name: full_ft_l2sp
    variant: full_ft_l2sp
    update: 4
  - name: lora4
    variant: lora4
    update: 4
  - name: lora16
    variant: lora16
    update: 4
  - name: oplora16
    variant: oplora16
    update: 4
  gsm8k_task: gsm8k_cot
  gsm8k_max_gen_toks: 16
  likelihood_tasks:
  - hellaswag
  - boolq
  - arc_easy
  backend: hf
  batch_size: 4
diagnostics:
  layers:
  - 0
  - 13
  - 27
  module: down_proj
  k: 16
  n_probe_math: 32
  n_probe_nonmath: 32
qualitative:
  file: data/task1/first_plot_questions.yaml
  max_new_tokens: 8
  annotate_ids:
  - what_is_your_wish
  - enough_of_my_husband
