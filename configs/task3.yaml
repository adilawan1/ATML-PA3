# Task 3: test-time compute (offline analysis on supplied rollouts + small live MATH run)
seed: 6304
data_root: data/ATML-PA3-Data      # set PA3_T3_DATA to override; folders below are relative to it
datasets:
  math:
    folder: MATH                    # VERIFY against the supplied README.MD
    kind: llm
    grader: math_verify
  mathvista:
    folder: MathVista               # VERIFY against the supplied README.MD
    kind: vlm
    grader: mathvista
    metadata: AI4Math/MathVista     # HF dataset with question_type / answer_type / precision / choices
    metadata_split: testmini

# Column names are resolved from these candidates (first match wins). Run `python -m task3.inspect_data`
# and edit if the supplied files use different names.
columns:
  dataset: [dataset]
  sample_id: [sample_id]
  rollout_id: [rollout_id]
  text: [response, text, generation, output, completion]
  token_ids: [token_ids, output_token_ids, generated_token_ids]
  n_tokens: [num_tokens, n_tokens, num_generated_tokens, length, output_length, gen_length]
  extracted: [extracted_answer, pred_answer, extracted, prediction]
  gold: [gold_answer, answer, gold, ground_truth]
  question: [problem, question, prompt_text, query]
  logp: [logp, token_logp, logprobs]
  kl: [kl_u_p, kl_uniform]
  attn_image: [attn_image, image_attention, image_attn, attention_image]
  attn_prompt: [attn_prompt, prompt_attention, prompt_text_attention, attn_prompt_text, attention_prompt]
  attn_generated: [attn_generated, generated_attention, generated_text_attention, attn_generated_text, attention_generated]

split:
  n_dev: 200
  n_live: 50

offline:
  budgets: [1, 2, 4, 8, 16, 32]
  n_orders: 10
  bootstrap: 1000
  quantiles: [0.05, 0.95]

adaptive:
  checks: [4, 8, 16]
  max_n: 32
  taus: [0.5, 0.625, 0.75, 0.875, 1.0]
  gammas: [0.0, 0.1, 0.25, 0.5]
  tolerance_pp: 1.0

live:
  model: Qwen/Qwen2.5-3B-Instruct
  revision: null                    # SET to the revision hash listed in the supplied README.MD
  system: "You are a helpful assistant."
  instruction: "Think step by step inside <think> </think> tags, then give your final answer inside \\boxed{}."
  separator: "\n\n"                 # VERIFY: how the instruction is appended to the problem in README.MD
  review: "Review the solution above. Identify and correct any errors; if it is correct, retain its answer. Give your final answer inside \\boxed{}."
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  single_max: 3072
  parallel_n: 3
  parallel_max: 1024
  revision_max: 2048
