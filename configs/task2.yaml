# Task 2: SigLIP-Qwen3 VLM and visual grounding (spec values unless marked "choice")
seed: 6304
llm: Qwen/Qwen3-0.6B
vision: google/siglip-base-patch16-224
n_visual_tokens: 196          # 49 for the optional 2x2-pooled run

data:
  coco_root: data/coco        # annotations + downloaded images (gitignored); override with PA3_COCO
  captions_train_images: 6000
  captions_per_train_image: 3 # choice: first 3 captions by annotation id
  captions_dev_images: 96
  vqa_min_agreement: 8        # of 10 annotators, per image
  vqa_pairs:                  # yes/no, number, other
    train: {"yes/no": 640, "number": 256, "other": 640}
    dev:   {"yes/no": 12,  "number": 8,   "other": 12}
    test:  {"yes/no": 36,  "number": 24,  "other": 36}
  grounding_pairs:            # choice: presence/counting split of the specified totals
    dev:  {presence: 12, counting: 12}    # 24 pairs / 48 questions
    test: {presence: 32, counting: 32}    # 64 pairs / 128 questions
  grounding_pool_size: {presence: 20000, counting: 20000}   # choice: pre-generated reusable training pools
  min_instance_area_frac: 0.005   # choice: counting/presence-positive images need all instances >= 0.5% of image area
  max_count: 4

prompts:                      # choice: fixed instruction text (kept identical across image conditions)
  caption: "Write a short caption for this image."
  answer_suffix: "Answer the question using a single word or phrase."   # LLaVA-1.5 short-answer prompt

train:
  micro_bs: 8
  grad_accum: 2                # effective batch 16
  weight_decay: 0.01           # choice: not applied to biases / 1-D params (same rule as Task 1)
  clip: 1.0
  warmup_frac: 0.05
  min_lr_frac: 0.10
  grad_checkpointing: true
  caps: {question: 80, caption: 64, answer: 16}
  ckpt_every: 250
  dev_eval_every: 500
  stages:
    - {name: caption_alignment, updates: 2250, connector_lr: 1.0e-3, lora_lr: null,
       mixture: {caption: 1.0}}
    - {name: visual_instruction, updates: 1500, connector_lr: 1.0e-4, lora_lr: 2.0e-5,
       mixture: {presence: 0.5, counting: 0.25, caption: 0.25}}
    - {name: natural_vqa, updates: 750, connector_lr: 5.0e-5, lora_lr: 1.0e-5,
       mixture: {vqa: 0.7, presence: 0.1, counting: 0.1, caption: 0.1}}

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj]

eval:
  max_new_tokens: 16
  batch_size: 8
  bootstrap: 4000
  n_qualitative_per_type: 2   # choice: first k test pairs per question type (saved pair order)
